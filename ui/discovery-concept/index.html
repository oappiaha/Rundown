<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Rundown · Discovery concept</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316140f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c9f24d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="wordmark">Rundown</span>
      <span class="concept">Concept · sample stories</span>
    </div>
    <div class="modes" role="tablist" aria-label="Layout">
      <button role="tab" data-mode="focus" aria-selected="true">Focus</button>
      <button role="tab" data-mode="explore" aria-selected="false">Explore</button>
    </div>
    <div class="tools">
      <button class="tool" id="tuneBtn" aria-expanded="false" aria-haspopup="dialog" aria-label="Tune feed">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h6M12 4.5h1M3 11.5h1M7 11.5h6"/><circle cx="10.5" cy="4.5" r="1.8"/><circle cx="5.5" cy="11.5" r="1.8"/></svg>
        <span class="txt">Tune</span>
      </button>
      <button class="tool" id="savedBtn" aria-expanded="false" aria-haspopup="dialog" aria-label="Saved stories">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 2.5h9v11l-4.5-3-4.5 3z"/></svg>
        <span class="txt">Saved</span><span class="count">0</span>
      </button>
    </div>
  </header>

  <nav class="chips" id="chips" aria-label="Topics"></nav>

  <main class="stage" id="stage" data-mode="focus" aria-label="Stories"></main>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <div class="scrim" id="scrim"></div>

  <aside class="panel" id="tray" role="dialog" aria-label="Saved stories" aria-hidden="true">
    <div class="panel-head">
      <span class="label">Saved · your collection</span>
      <button class="icon-btn close" aria-label="Close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="panel-body"></div>
  </aside>

  <aside class="panel" id="reader" role="dialog" aria-label="Story" aria-hidden="true">
    <div class="panel-head">
      <span class="label"></span>
      <div class="nav">
        <button class="icon-btn reader-prev" aria-label="Previous story"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>
        <button class="icon-btn reader-next" aria-label="Next story"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
        <button class="icon-btn close" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
    </div>
    <div class="panel-body"></div>
  </aside>

  <div class="pop" id="tune" role="dialog" aria-label="Tune feed"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
