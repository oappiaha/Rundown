<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUNDOWN · Stream Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lcd-bg:#0a1520; --lcd-text:#78c8e8; --lcd-dim:#2c6478;
    --td:#1a1a1a; --tm:#555; --tl:#909090; --blue:#0057D9;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#0a0a0a;
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:20px; gap:16px;
    font-family:'Barlow Condensed',sans-serif;
  }

  .page-label {
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; color:#333; letter-spacing:.2em; text-transform:uppercase;
  }

  /* 16:9 stream canvas */
  .canvas {
    width:100%;
    max-width:1280px;
    aspect-ratio:16/9;
    position:relative;
    background:#050507;
    border-radius:6px;
    overflow:hidden;
    border:1px solid #1a1a1a;
    box-shadow:0 0 60px rgba(0,0,0,.8);
  }

  /* ── CAMERA AREA ── */
  .cam-area {
    position:absolute;
    top:0; left:0;
    /* leaves room for right panel and bottom bar */
    right:calc(300px * (100% / 1920px) * (1920/1280));
    bottom:calc(110px * (100% / 1080px) * (1080/720));
    display:flex; gap:1px;
  }
  .cam {
    flex:1; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .cam-1 { background:linear-gradient(180deg,#06080f 0%,#020408 100%); border-right:1px solid #0d0d0d; }
  .cam-2 { background:linear-gradient(180deg,#080508 0%,#030204 100%); }
  .cam-sil {
    width:48%; height:84%;
    border-radius:50% 50% 0 0/36% 36% 0 0;
    position:absolute; bottom:0;
  }
  .cam-1 .cam-sil { background:linear-gradient(180deg,#0d1828 0%,#050810 100%); }
  .cam-2 .cam-sil { background:linear-gradient(180deg,#120a1e 0%,#060410 100%); }
  .cam-corner { position:absolute; top:0; left:0; width:16px; height:1px; background:#fff; opacity:.25; }
  .cam-corner::after { content:''; position:absolute; top:0; left:0; width:1px; height:16px; background:#fff; opacity:1; }
  .cam-label {
    position:absolute; top:8px; left:20px;
    font-family:'IBM Plex Mono',monospace; font-size:9px; color:rgba(255,255,255,.2);
    letter-spacing:.14em; text-transform:uppercase;
  }

  /* ── RIGHT PANEL ── */
  .right-panel {
    position:absolute;
    top:0; right:0;
    /* proportional to canvas */
    width:calc(300 / 1920 * 100%);
    bottom:calc(110 / 1080 * 100%);
    background:
      repeating-linear-gradient(90deg,transparent,transparent 4px,rgba(255,255,255,.022) 4px,rgba(255,255,255,.022) 5px),
      linear-gradient(162deg,#f8f8f8 0%,#ebebeb 10%,#d8d8d8 24%,#c8c8c8 38%,#d4d4d4 52%,#bcbcbc 66%,#cacaca 80%,#e0e0e0 100%);
    border-left:1px solid #a8a8a8;
    display:flex; flex-direction:column;
    overflow:hidden; position:absolute;
  }
  .right-panel::before {
    content:''; position:absolute; top:0; left:0; right:0; height:42%;
    background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,transparent 100%);
    pointer-events:none; z-index:1;
  }
  .right-panel::after {
    content:''; position:absolute; inset:0;
    border-left:3px solid rgba(255,255,255,.55);
    pointer-events:none; z-index:2;
  }

  .rp-head {
    padding:10px 12px 8px;
    border-bottom:1px solid rgba(0,0,0,.12);
    display:flex; align-items:baseline; justify-content:space-between;
    position:relative; z-index:3;
  }
  .rp-sony { font-size:20px; font-weight:900; color:var(--td); letter-spacing:-.01em; line-height:1; }
  .rp-lbl { font-family:'IBM Plex Mono',monospace; font-size:6px; font-weight:500; color:var(--tl); letter-spacing:.16em; text-transform:uppercase; }

  .rp-bezel {
    margin:6px 8px 5px;
    background:#1e1e1e; border-radius:3px; padding:2px;
    box-shadow:inset 2px 2px 5px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.28);
    position:relative; z-index:3;
  }
  .rp-lcd {
    background:var(--lcd-bg); border-radius:2px; padding:7px 8px 6px;
    position:relative; overflow:hidden;
  }
  .rp-lcd::after {
    content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 3px);
    pointer-events:none; z-index:1;
  }
  .rp-lcd::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 0%,rgba(120,200,232,.15) 0%,transparent 60%);
    pointer-events:none; z-index:0;
  }
  .lcd-np-s {
    font-family:'IBM Plex Mono',monospace; font-size:6px; color:var(--lcd-dim);
    letter-spacing:.18em; text-transform:uppercase; margin-bottom:3px;
    display:flex; align-items:center; gap:3px; position:relative; z-index:2;
  }
  .lcd-dot-s {
    width:4px; height:4px; background:var(--lcd-text); border-radius:50%;
    box-shadow:0 0 4px var(--lcd-text); animation:npb 1s step-end infinite;
  }
  @keyframes npb { 0%,100%{opacity:1} 50%{opacity:.08} }
  .lcd-topic-wrap-s {
    position:relative; z-index:2;
    overflow:hidden; width:100%; height:18px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 8%,#000 92%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0%,#000 8%,#000 92%,transparent 100%);
  }
  .lcd-topic-s {
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:500;
    color:var(--lcd-text); text-transform:uppercase; letter-spacing:.03em; line-height:1.6;
    text-shadow:0 0 6px var(--lcd-text); white-space:nowrap;
    display:inline-block;
  }
  .lcd-topic-s.scrolling { animation:ticker linear infinite; }
  @keyframes ticker { 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }
  .lcd-topic-s.flip { animation:flip .26s ease; }
  @keyframes flip {
    0%{opacity:1;transform:translateX(0)} 38%{opacity:0;transform:translateX(-8px)}
    62%{opacity:0;transform:translateX(6px)} 100%{opacity:1;transform:translateX(0)}
  }
  .lcd-meta-s {
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:4px; position:relative; z-index:2;
  }
  .lcd-trk-s { font-family:'IBM Plex Mono',monospace; font-size:6px; color:var(--lcd-dim); letter-spacing:.1em; }
  .lcd-time-s {
    font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:300;
    color:var(--lcd-text); text-shadow:0 0 6px var(--lcd-text);
    font-variant-numeric:tabular-nums; line-height:1;
  }
  .lcd-time-s.urg { color:#e090a8; text-shadow:0 0 5px #e090a8; animation:lb .4s step-end infinite; }
  @keyframes lb { 0%,100%{opacity:1} 50%{opacity:.1} }
  .lcd-seek-s { height:2px; background:rgba(120,200,232,.1); border-radius:1px; margin-top:5px; position:relative; z-index:2; overflow:hidden; }
  .lcd-sf-s { height:2px; background:var(--lcd-text); box-shadow:0 0 4px var(--lcd-text); border-radius:1px; transition:width 1s linear; }
  .lcd-sf-s.urg { background:#e090a8; }

  .rp-tracks {
    flex:1; display:flex; flex-direction:column;
    overflow:hidden; position:relative; z-index:3;
    border-top:1px solid rgba(0,0,0,.1);
  }
  .rp-tracks::before {
    content:''; position:absolute; inset:0;
    box-shadow:inset 0 3px 6px rgba(0,0,0,.1);
    pointer-events:none; z-index:1;
  }
  .tr-s {
    display:flex; align-items:center; padding:0 10px;
    border-bottom:1px solid rgba(0,0,0,.06);
    cursor:pointer; position:relative;
    flex:1; min-height:0; gap:6px; transition:background .15s;
  }
  .tr-s.done { background:rgba(0,0,0,.03); opacity:.35; }
  .tr-s.active { background:linear-gradient(90deg,rgba(0,87,217,.1) 0%,rgba(0,87,217,.03) 100%); }
  .tr-s.active::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--blue); }
  .tr-s.done::after { content:'✓'; position:absolute; right:8px; font-size:7px; color:#bbb; }
  .tr-s.active::after { content:'▶'; position:absolute; right:8px; font-size:6px; color:var(--blue); }
  .tr-n-s { font-family:'IBM Plex Mono',monospace; font-size:7px; color:var(--tl); width:12px; text-align:right; flex-shrink:0; }
  .tr-s.active .tr-n-s { color:var(--blue); } .tr-s.done .tr-n-s { color:#ccc; }
  .tr-t-s { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .tr-s.active .tr-t-s { color:var(--td); font-size:10px; }
  .tr-s.done .tr-t-s { color:#bbb; text-decoration:line-through; text-decoration-color:#ccc; }
  .tr-s.upcoming .tr-t-s { color:var(--tm); }

  .rp-foot {
    padding:4px 12px 5px;
    display:flex; align-items:center; justify-content:space-between;
    position:relative; z-index:3;
    border-top:1px solid rgba(0,0,0,.07);
  }
  .rp-foot span { font-family:'IBM Plex Mono',monospace; font-size:5px; color:var(--tl); letter-spacing:.14em; text-transform:uppercase; }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position:absolute;
    bottom:0; left:0; right:0;
    height:calc(110 / 1080 * 100%);
    background:
      repeating-linear-gradient(90deg,transparent,transparent 4px,rgba(255,255,255,.016) 4px,rgba(255,255,255,.016) 5px),
      linear-gradient(180deg,#f0f0f0 0%,#e0e0e0 30%,#d0d0d0 55%,#c8c8c8 70%,#d4d4d4 100%);
    border-top:1px solid #a0a0a0;
    box-shadow:0 -2px 0 rgba(255,255,255,.45);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:absolute;
  }
  .bottom-bar::before {
    content:''; position:absolute; top:0; left:0; right:0; height:50%;
    background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,transparent 100%);
    pointer-events:none; z-index:0;
  }

  .bb-now {
    position:absolute; left:3%;
    display:flex; flex-direction:column; gap:1px;
  }
  .bb-now-lbl { font-family:'IBM Plex Mono',monospace; font-size:7px; color:var(--tl); letter-spacing:.2em; text-transform:uppercase; }
  .bb-now-t { font-size:16px; font-weight:900; color:var(--td); text-transform:uppercase; letter-spacing:.04em; line-height:1; }
  .bb-now-sub { font-family:'IBM Plex Mono',monospace; font-size:7px; color:var(--tl); letter-spacing:.12em; text-transform:uppercase; }

  .bb-btns {
    display:flex; align-items:center; gap:12px;
    position:relative; z-index:1;
  }
  .bb-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .bb-lbl { font-family:'IBM Plex Mono',monospace; font-size:6px; font-weight:500; color:var(--tl); letter-spacing:.12em; text-transform:uppercase; }

  .hw {
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; cursor:pointer; border:none; outline:none;
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    color:var(--td); transition:transform .08s, box-shadow .08s, background .08s;
    background:radial-gradient(circle at 36% 34%,#fafafa,#d8d8d8 52%,#bebebe);
    box-shadow:3px 3px 6px rgba(0,0,0,.32),-1.5px -1.5px 4px rgba(255,255,255,.88),inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(0,0,0,.1);
    user-select:none;
  }
  .hw:active {
    transform:translateY(1.5px) scale(.95);
    background:radial-gradient(circle at 36% 34%,#d0d0d0,#c0c0c0 52%,#d0d0d0);
    box-shadow:1px 1px 3px rgba(0,0,0,.28),-.5px -.5px 1.5px rgba(255,255,255,.6),inset 2.5px 2.5px 5px rgba(0,0,0,.22),inset -1px -1px 3px rgba(255,255,255,.4);
  }
  .hw-lg { width:38px; height:38px; font-size:13px; }
  .hw-md { width:28px; height:28px; font-size:10px; }
  .hw-sq { width:24px; height:24px; font-size:9px; border-radius:4px; }
  .bb-div { width:1px; height:30px; background:linear-gradient(180deg,transparent,rgba(0,0,0,.14) 30%,rgba(0,0,0,.14) 70%,transparent); margin:0 6px; }

  .bb-ctr {
    position:absolute; right:3%;
    display:flex; flex-direction:column; align-items:flex-end; gap:1px;
  }
  .bb-ctr-lbl { font-family:'IBM Plex Mono',monospace; font-size:7px; color:var(--tl); letter-spacing:.2em; text-transform:uppercase; }
  .bb-ctr-num { font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:300; color:var(--td); letter-spacing:.04em; font-variant-numeric:tabular-nums; line-height:1; }
  .bb-ctr-of { font-family:'IBM Plex Mono',monospace; font-size:7px; color:var(--tl); letter-spacing:.12em; }

  /* flash */
  .flasher { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:200; transition:opacity .04s; }
  .flasher.on { opacity:.06; }

  /* ── EXTERNAL PRODUCER CONTROLS ── */
  .producer {
    width:100%; max-width:1280px;
    display:flex; gap:10px; align-items:center;
    flex-wrap:wrap;
  }
  .prod-label { font-family:'IBM Plex Mono',monospace; font-size:9px; color:#333; letter-spacing:.18em; text-transform:uppercase; margin-right:4px; }
  .prod-btn {
    background:linear-gradient(145deg,#2a2a2a,#1a1a1a);
    border:1px solid #333; border-radius:4px;
    color:#bbb; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:500;
    padding:8px 18px; cursor:pointer; letter-spacing:.08em; text-transform:uppercase;
    transition:all .1s; user-select:none;
    box-shadow:2px 2px 4px rgba(0,0,0,.4);
  }
  .prod-btn:hover { border-color:#555; color:#eee; }
  .prod-btn:active { transform:translateY(1px); }
  .prod-btn.pause-active { border-color:#0057D9; color:#4a8aff; background:linear-gradient(145deg,#0d1a35,#081020); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; width:100%; }
  .chip {
    background:linear-gradient(145deg,#222,#161616); color:#666;
    font-family:'IBM Plex Mono',monospace; font-size:9px;
    padding:4px 10px; border-radius:20px; border:1px solid #2a2a2a;
    cursor:pointer; transition:all .1s; user-select:none; letter-spacing:.04em; text-transform:uppercase;
    box-shadow:1.5px 1.5px 3px rgba(0,0,0,.3);
  }
  .chip:hover { border-color:#444; color:#aaa; }
  .chip.cur { background:linear-gradient(145deg,#0d1a35,#081020); border-color:#0057D9; color:#4a8aff; }
  .chip.done { opacity:.25; text-decoration:line-through; }
</style>
</head>
<body>

<div class="page-label">Stream Preview — 16:9 Canvas · 1920×1080</div>

<!-- STREAM CANVAS -->
<div class="canvas" id="canvas">

  <!-- cameras -->
  <div class="cam-area">
    <div class="cam cam-1">
      <div class="cam-corner"></div>
      <div class="cam-sil"></div>
      <div class="cam-label">Webcam 1</div>
    </div>
    <div class="cam cam-2">
      <div class="cam-corner"></div>
      <div class="cam-sil"></div>
      <div class="cam-label">Webcam 2</div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="rp-head">
      <div class="rp-sony">BEEZY</div>
      <div class="rp-lbl">RUNDOWN</div>
    </div>
    <div class="rp-bezel">
      <div class="rp-lcd">
        <div class="lcd-np-s"><div class="lcd-dot-s"></div>NOW PLAYING</div>
        <div class="lcd-topic-wrap-s" id="lcdTWrap"><div class="lcd-topic-s" id="lcdT">NBA PLAYOFFS</div></div>
        <div class="lcd-meta-s">
          <div class="lcd-trk-s" id="lcdTrk">TRK 01/08</div>
          <div class="lcd-time-s" id="lcdTime">0:30</div>
        </div>
        <div class="lcd-seek-s"><div class="lcd-sf-s" id="lcdSf" style="width:100%"></div></div>
      </div>
    </div>
    <div class="rp-tracks" id="rpTracks"></div>
    <div class="rp-foot">
      <span>RD-001</span><span id="rpCtr">01 / 08</span>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="bb-now">
      <div class="bb-now-lbl">Now On</div>
      <div class="bb-now-t" id="bbTopic">NBA PLAYOFFS</div>
      <div class="bb-now-sub" id="bbSub">Topic 01 of 08</div>
    </div>
    <div class="bb-btns">
      <div class="bb-wrap">
        <button class="hw hw-md" onclick="prevTopic()">⏮</button>
        <div class="bb-lbl">PREV</div>
      </div>
      <div class="bb-wrap">
        <button class="hw hw-lg" id="playHw" onclick="togglePause()">⏸</button>
        <div class="bb-lbl" id="playHwLbl">PAUSE</div>
      </div>
      <div class="bb-wrap">
        <button class="hw hw-md" onclick="nextTopic()">⏭</button>
        <div class="bb-lbl">NEXT</div>
      </div>
      <div class="bb-div"></div>
      <div class="bb-wrap">
        <button class="hw hw-sq" onclick="resetAll()">■</button>
        <div class="bb-lbl">RESET</div>
      </div>
    </div>
    <div class="bb-ctr">
      <div class="bb-ctr-lbl">Track</div>
      <div class="bb-ctr-num" id="bbCtrNum">01</div>
      <div class="bb-ctr-of">of 08</div>
    </div>
  </div>

  <div class="flasher" id="flasher"></div>
</div>

<!-- PRODUCER PANEL -->
<div class="producer">
  <div class="prod-label">Producer Controls</div>
  <button class="prod-btn" onclick="prevTopic()">⏮ Prev</button>
  <button class="prod-btn" onclick="nextTopic()">Next ⏭</button>
  <button class="prod-btn" id="prodPause" onclick="togglePause()">⏸ Pause</button>
  <button class="prod-btn" onclick="resetAll()">■ Reset</button>
  <div class="chips" id="chips"></div>
</div>

<script>
const TOPICS=[
  {text:"NBA Playoffs",dur:30},{text:"Drake vs Kendrick",dur:25},
  {text:"Tesla Self-Drive",dur:30},{text:"AI Takes Your Job",dur:35},
  {text:"Celtics Repeat",dur:25},{text:"Summer Movies",dur:30},
  {text:"Social Media",dur:30},{text:"Hot Take",dur:20}
];
let cur=0,tl=TOPICS[0].dur,tot=TOPICS[0].dur,paused=false;

const e={
  lcdT:document.getElementById('lcdT'),
  lcdTrk:document.getElementById('lcdTrk'),
  lcdTime:document.getElementById('lcdTime'),
  lcdSf:document.getElementById('lcdSf'),
  rpTracks:document.getElementById('rpTracks'),
  rpCtr:document.getElementById('rpCtr'),
  bbTopic:document.getElementById('bbTopic'),
  bbSub:document.getElementById('bbSub'),
  bbCtrNum:document.getElementById('bbCtrNum'),
  playHw:document.getElementById('playHw'),
  playHwLbl:document.getElementById('playHwLbl'),
  prodPause:document.getElementById('prodPause'),
  chips:document.getElementById('chips'),
  flasher:document.getElementById('flasher'),
};

function pad(n){return String(n).padStart(2,'0')}
function fmt(s){return`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`}

function buildList(){
  e.rpTracks.innerHTML='';
  TOPICS.forEach((t,i)=>{
    const el=document.createElement('div');
    let c='tr-s ';if(i<cur)c+='done';else if(i===cur)c+='active';else c+='upcoming';
    el.className=c;
    el.innerHTML=`<span class="tr-n-s">${pad(i+1)}</span><span class="tr-t-s">${t.text}</span>`;
    el.addEventListener('click',()=>goTo(i));
    e.rpTracks.appendChild(el);
  });
  e.lcdTrk.textContent=`TRK ${pad(cur+1)}/08`;
  e.rpCtr.textContent=`${pad(cur+1)} / 08`;
  e.bbTopic.textContent=TOPICS[cur].text.toUpperCase();
  e.bbSub.textContent=`Topic ${pad(cur+1)} of 08`;
  e.bbCtrNum.textContent=pad(cur+1);
}

function buildChips(){
  e.chips.innerHTML='';
  TOPICS.forEach((t,i)=>{
    const c=document.createElement('span');
    let cls='chip';if(i===cur)cls+=' cur';else if(i<cur)cls+=' done';
    c.className=cls;c.textContent=`${pad(i+1)}. ${t.text}`;
    c.addEventListener('click',()=>goTo(i));
    e.chips.appendChild(c);
  });
}

function updateTimer(){
  const f=fmt(tl);
  e.lcdTime.textContent=f;
  const urg=tl<=8;
  e.lcdTime.classList.toggle('urg',urg);
  e.lcdSf.classList.toggle('urg',urg);
  e.lcdSf.style.width=(tot>0?(tl/tot)*100:0)+'%';
}

function doFlash(){e.flasher.classList.add('on');setTimeout(()=>e.flasher.classList.remove('on'),90)}

function applyTicker(text){
  const el=e.lcdT, wrap=document.getElementById('lcdTWrap');
  el.textContent=text.toUpperCase();
  el.classList.remove('scrolling');
  void el.offsetWidth;
  if(el.scrollWidth>wrap.clientWidth){
    const dur=(el.scrollWidth+wrap.clientWidth)/60;
    el.style.animationDuration=dur+'s';
    el.classList.add('scrolling');
  }
}

function lcdFlip(text){
  e.lcdT.classList.remove('scrolling');
  e.lcdT.classList.add('flip');
  setTimeout(()=>{ e.lcdT.classList.remove('flip'); applyTicker(text); },130);
}

function goTo(i){
  if(i<0||i>=TOPICS.length)return;
  cur=i;tl=TOPICS[i].dur;tot=TOPICS[i].dur;
  doFlash();lcdFlip(TOPICS[i].text);buildList();buildChips();updateTimer();
}

function nextTopic(){goTo(cur+1)}
function prevTopic(){goTo(cur-1)}

function togglePause(){
  paused=!paused;
  e.playHw.textContent=paused?'▶':'⏸';
  e.playHwLbl.textContent=paused?'PLAY':'PAUSE';
  e.prodPause.textContent=paused?'▶ Resume':'⏸ Pause';
  e.prodPause.classList.toggle('pause-active',paused);
}

function resetAll(){
  paused=false;
  e.playHw.textContent='⏸';e.playHwLbl.textContent='PAUSE';
  e.prodPause.textContent='⏸ Pause';e.prodPause.classList.remove('pause-active');
  goTo(0);
}

let lastKey=null,lastKeyTime=0;
document.addEventListener('keydown',ev=>{
  const now=Date.now();
  if(ev.key===lastKey&&now-lastKeyTime<300)return;
  lastKey=ev.key;lastKeyTime=now;
  if(ev.key==='ArrowRight')nextTopic();
  if(ev.key==='ArrowLeft')prevTopic();
  if(ev.key===' '){ev.preventDefault();togglePause();}
  const n=parseInt(ev.key);if(n>=1&&n<=8)goTo(n-1);
});

buildList();buildChips();updateTimer();
applyTicker(TOPICS[0].text);
setInterval(()=>{
  if(paused)return;
  if(tl>0){tl--;updateTimer();}
  else if(cur<TOPICS.length-1)goTo(cur+1);
},1000);
</script>
</body>
</html>
